name: doctor-tracker

services:
  mongodb:
    image: mongo:8.0
    container_name: doctor-tracker-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-doctor_tracker}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: doctor-tracker-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
    image: doctor-tracker-backend
    container_name: doctor-tracker-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # App settings (JWT secrets, CORS, seed admin, ...). Override the file
    # with BACKEND_ENV_FILE, e.g. for production.
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/configs/.env.development}
    # Inside the compose network MongoDB/Redis are reached by service name,
    # not localhost, so these two override the values from the env file.
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME:-doctor_tracker}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "${BACKEND_PORT:-5000}:${PORT:-5000}"

  frontend:
    build:
      context: ./frontend
    image: doctor-tracker-frontend
    container_name: doctor-tracker-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Same settings file as the backend (BACKEND_URL, COOKIE_SECURE, ...).
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/configs/.env.development}
    environment:
      # Reach the API inside the compose network, not via localhost.
      BACKEND_URL: http://backend:${PORT:-5000}/api/v1
      # The env file's PORT is the backend's; Next.js listens on 3000.
      PORT: "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mongodb_data:
  redis_data:
